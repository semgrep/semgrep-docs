name: Update OpenAPI specs

# Keeps the checked-in OpenAPI specs in sync with what semgrep-app serves in
# production. Mintlify auto-generates the API reference pages from these files
# (see the `openapi` groups in docs/docs.json), so merging the PR this workflow
# opens is all it takes to publish new or changed endpoints.

on:
  schedule:
    - cron: "0 6 * * 1-5" # weekday mornings UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-openapi-specs
  cancel-in-progress: true

jobs:
  update-specs:
    name: Fetch specs and open PR if changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Runs as the semgrep-docs-release App rather than GITHUB_TOKEN for two
      # reasons: App-authored PRs trigger Docs CI (GITHUB_TOKEN-authored ones do
      # not), and the team-reviewers request below needs org-level member read,
      # which the repo-scoped GITHUB_TOKEN does not carry. Same app and pinned
      # action version as update-help-command.yml.
      - name: Authenticate as semgrep-docs-release
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.SEMGREP_DOCS_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMGREP_DOCS_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ steps.generate-token.outputs.token }}
          # Full history: the changelog generator diffs the specs across git
          # revisions, which oasdiff reads with `git show` under the hood.
          fetch-depth: 0

      - name: Fetch latest specs from semgrep.dev
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://semgrep.dev/api/v1/public_v1.openapi.yaml \
            --output docs/public_v1.openapi.yaml
          curl --fail --silent --show-error --location --retry 3 \
            https://semgrep.dev/api/v2/openapi.yaml \
            --output docs/public_v2.openapi.yaml

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      # Upstream ships ReDoc vendor extensions that Mintlify does not read, so
      # nav group labels (x-displayName) and beta/experimental badges
      # (x-badges) render as nothing. Mirror them into x-group and x-mint.
      # Safe to drop once semgrep-app emits the Mintlify keys natively.
      - name: Mirror ReDoc extensions into Mintlify equivalents
        run: uv run scripts/mirror_openapi.py docs/public_v1.openapi.yaml docs/public_v2.openapi.yaml

      # Mintlify ignores the `tags:` array and derives nav order from the order
      # paths appear in, so upstream's URL-alphabetical emission order decides
      # the sidebar. Re-sort into display-name order. Must run after the mirror
      # step above, which supplies the x-group names this sorts on.
      - name: Sort API navigation into alphabetical order
        run: uv run scripts/sort_openapi_nav.py docs/public_v1.openapi.yaml docs/public_v2.openapi.yaml

      # Upstream emits no `servers:` block, and Mintlify has no docs.json
      # override for OpenAPI-generated pages, so without this the playground
      # renders https://api.example.com and cannot send requests. Runs after
      # the two steps above, which parse `paths:` and `tags:` and neither of
      # which needs to see the block this adds. Safe to drop once semgrep-app
      # emits `servers` natively -- this step no-ops rather than overwriting it.
      - name: Add the API base URL Mintlify's playground needs
        run: uv run scripts/add_openapi_servers.py docs/public_v1.openapi.yaml docs/public_v2.openapi.yaml

      # Checksummed binary download rather than a third-party action, per the
      # supply-chain pinning policy. Keep the version pinned: bumping oasdiff
      # regenerates every changelog entry, which belongs in its own PR.
      - name: Install oasdiff (pinned)
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/oasdiff.tar.gz \
            https://github.com/oasdiff/oasdiff/releases/download/v1.28.0/oasdiff_1.28.0_linux_amd64.tar.gz
          echo "e0ef076f2cf953d922addc04be9c3851cf3ec18f7678d2b94d44cea23dca51b5  /tmp/oasdiff.tar.gz" | sha256sum --check
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo install /tmp/oasdiff /usr/local/bin/oasdiff

      # Must run after the mirror, sort, and servers steps so the working-tree
      # specs being diffed are in their final committed form. Runs before
      # validate so the generated MDX is validated too.
      - name: Regenerate API changelogs
        run: |
          uv run scripts/generate_api_changelog.py docs/public_v1.openapi.yaml \
            docs/api-reference/v1/Changelog.mdx \
            --api-name "Semgrep API v1" --api-href /api-reference/v1/Introduction \
            --link-base /api-reference/v1
          uv run scripts/generate_api_changelog.py docs/public_v2.openapi.yaml \
            docs/api-reference/v2/Changelog.mdx \
            --api-name "Semgrep API v2" --api-href /api-reference/v2/Introduction \
            --link-base /api-reference/v2 \
            --note "The v2 API is experimental; breaking changes are expected while it is in alpha."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate docs build with fetched specs
        working-directory: docs
        run: npx --yes mintlify@latest validate

      - name: Open PR if specs changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          # Commit via the GitHub API so GitHub signs the commit — the repo's
          # "Require Signed Commits" ruleset rejects unsigned CLI commits.
          sign-commits: true
          add-paths: |
            docs/public_v1.openapi.yaml
            docs/public_v2.openapi.yaml
            docs/api-reference/v1/Changelog.mdx
            docs/api-reference/v2/Changelog.mdx
          branch: chore/update-openapi-specs
          delete-branch: true
          # Re-issued on every run, not just when the PR is first opened. That
          # is a no-op while a request is still pending, so the daily cron does
          # not spam -- but it does re-request anyone who already reviewed if a
          # later run pushes another spec change.
          # tech-writers reviews the rendered docs; appex owns the specs
          # upstream in semgrep-app. Both need at least read on this repo or
          # GitHub rejects the request.
          team-reviewers: |
            tech-writers
            appex
          commit-message: "chore: sync OpenAPI specs from semgrep.dev"
          title: "chore: sync OpenAPI specs from semgrep.dev"
          body: |
            Automated refresh of the API specs that Mintlify renders the API
            reference from. Review the diff for unintended endpoint or schema
            removals before merging.

            - `docs/public_v1.openapi.yaml` ← https://semgrep.dev/api/v1/public_v1.openapi.yaml
            - `docs/public_v2.openapi.yaml` ← https://semgrep.dev/api/v2/openapi.yaml

            The API changelog pages under `docs/api-reference/*/Changelog.mdx`
            are regenerated from the spec's git history by
            `scripts/generate_api_changelog.py`.
